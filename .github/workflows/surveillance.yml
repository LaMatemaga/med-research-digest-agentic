name: Clinical Surveillance Run

on:
  schedule:
    # Daily at 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  surveillance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js (for npx-launched MCP servers and the Claude Code CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore seen-items memory
        # Actions cache keys are immutable, so we key by run id and restore from the
        # most recent prefix match — the save step below writes today's run under a
        # fresh key, and tomorrow's run picks it up via restore-keys.
        uses: actions/cache/restore@v4
        with:
          path: data/seen_items.db
          key: seen-items-db-${{ github.run_id }}
          restore-keys: |
            seen-items-db-

      - name: Run the surveillance pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --days 1

      - name: Save seen-items memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/seen_items.db
          key: seen-items-db-${{ github.run_id }}

      - name: Upload generated digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: outputs/
          if-no-files-found: ignore
